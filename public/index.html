<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽奖系统 · 选择团队</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<style>
  .landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 22px;
    gap: 8px;
  }
  .landing-head { text-align: center; margin-bottom: 26px; }
  .landing-head h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 2px;
    font-weight: 800;
    background: linear-gradient(100deg, #d92b1e 10%, #f08a1e 50%, #2a5cd4 95%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .landing-head p { margin: 8px 0 0; color: var(--ink-3); font-size: 13.5px; letter-spacing: 3px; }
  .team-grid {
    width: 100%;
    max-width: 760px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .team-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 26px 24px;
    box-shadow: var(--shadow-md);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
    position: relative;
    overflow: hidden;
  }
  .team-card::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    opacity: .1;
  }
  .team-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .team-card.cc { border-color: #f6d3cc; }
  .team-card.cc::after { background: #e23b2e; }
  .team-card.cc:hover { border-color: #eeb3a9; }
  .team-card.lp { border-color: #cfdcf6; }
  .team-card.lp::after { background: #2a5cd4; }
  .team-card.lp:hover { border-color: #a9c2ee; }
  .team-card.cash { border-color: #ddcdf5; }
  .team-card.cash::after { background: #7c3fcc; }
  .team-card.cash:hover { border-color: #c1a3ec; }
  .tc-badge {
    width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: #fff;
    margin-bottom: 14px;
  }
  .team-card.cc .tc-badge { background: linear-gradient(135deg, #f0473a, #c5231a); box-shadow: 0 6px 16px rgba(226,59,46,.3); }
  .team-card.lp .tc-badge { background: linear-gradient(135deg, #4f8ef7, #1b4bb8); box-shadow: 0 6px 16px rgba(42,92,212,.3); }
  .team-card.cash .tc-badge { background: linear-gradient(135deg, #a76cf0, #6425b0); box-shadow: 0 6px 16px rgba(110,45,190,.3); font-size: 22px; }
  .tc-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .tc-sub { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
  .tc-stats { display: flex; gap: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .tc-stats div { font-size: 12px; color: var(--ink-3); }
  .tc-stats b { display: block; font-size: 19px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
  .tc-go {
    margin-top: 18px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .team-card.cc .tc-go { color: var(--red); }
  .team-card.lp .tc-go { color: #2a5cd4; }
  .team-card.cash .tc-go { color: #7c3fcc; }
  .landing-foot { margin-top: 30px; font-size: 12.5px; color: var(--ink-3); }
  .landing-foot a { color: var(--ink-2); }
</style>
</head>
<body class="lottery-body">

<div class="landing">
  <div class="landing-head">
    <h1>幸 运 大 转 盘</h1>
    <p>PLEASE CHOOSE YOUR TEAM</p>
  </div>

  <div class="team-grid" id="teamGrid">
    <a class="team-card cc" href="/cc">
      <div class="tc-badge">CC</div>
      <div class="tc-name">CC 团队</div>
      <div class="tc-sub">点击进入 CC 团队专属抽奖页</div>
      <div class="tc-stats" id="stat-cc">
        <div><b>—</b>剩余可抽</div>
        <div><b>—</b>奖品种类</div>
        <div><b>—</b>可抽奖人数</div>
      </div>
      <div class="tc-go">进入抽奖 →</div>
    </a>

    <a class="team-card lp" href="/lp">
      <div class="tc-badge">LP</div>
      <div class="tc-name">LP 团队</div>
      <div class="tc-sub">点击进入 LP 团队专属抽奖页</div>
      <div class="tc-stats" id="stat-lp">
        <div><b>—</b>剩余可抽</div>
        <div><b>—</b>奖品种类</div>
        <div><b>—</b>可抽奖人数</div>
      </div>
      <div class="tc-go">进入抽奖 →</div>
    </a>

    <a class="team-card cash" href="/cash">
      <div class="tc-badge">¥</div>
      <div class="tc-name">CC 现金抽奖</div>
      <div class="tc-sub">独立奖池 · 独立次数 · 各奖项概率可配置</div>
      <div class="tc-stats" id="stat-cash">
        <div><b>—</b>剩余可抽</div>
        <div><b>—</b>现金奖项</div>
        <div><b>—</b>可抽奖人数</div>
      </div>
      <div class="tc-go">进入现金抽奖 →</div>
    </a>
  </div>

  <div class="landing-foot">
    奖品由管理员统一配置 · <a href="/admin">管理后台</a>
  </div>
</div>

<script>
  (async function () {
    try {
      const r = await fetch('/api/teams');
      const d = await r.json();
      (d.overview || []).forEach(function (t) {
        var box = document.getElementById('stat-' + t.id);
        if (!box) return;
        box.innerHTML =
          '<div><b>' + t.availableWins + '</b>剩余可抽（次）</div>' +
          '<div><b>' + t.prizeCount + '</b>奖品种类</div>' +
          '<div><b>' + t.readyCount + '</b>可抽奖人数</div>';
        var nameEl = document.querySelector('.team-card.' + t.id + ' .tc-name');
        if (nameEl && t.name) nameEl.textContent = t.name;
      });
    } catch (e) { /* 忽略：不影响进入页面 */ }
    try {
      const r = await fetch('/api/cash/state');
      const d = await r.json();
      const s = d.stats || {};
      var box = document.getElementById('stat-cash');
      if (box) {
        box.innerHTML =
          '<div><b>' + s.availableWins + '</b>剩余可抽（次）</div>' +
          '<div><b>' + s.prizeCount + '</b>现金奖项</div>' +
          '<div><b>' + s.readyCount + '</b>可抽奖人数</div>';
      }
    } catch (e) { /* 忽略 */ }
  })();
</script>
</body>
</html>
