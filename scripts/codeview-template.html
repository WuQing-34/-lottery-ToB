<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖系统 · 源码浏览</title>
<style>
  :root{
    --bg:#1e1e1e; --side:#252526; --side2:#2d2d2d; --act:#094771;
    --tab:#2d2d2d; --tab-on:#1e1e1e; --line:#333; --text:#d4d4d4;
    --dim:#858585; --accent:#007acc; --border:#3c3c3c; --sel:#264f78;
    --hover:#2a2d2e; --status:#007acc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:13px/1.5 "Cascadia Code","JetBrains Mono",Consolas,"Microsoft YaHei",monospace;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .titlebar{
    height:36px;flex:none;background:#323233;border-bottom:1px solid #1a1a1a;
    display:flex;align-items:center;gap:10px;padding:0 12px;user-select:none;
  }
  .dots{display:flex;gap:7px;margin-right:4px}
  .dots i{width:11px;height:11px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .title{font-size:12px;color:#ccc;letter-spacing:.3px}
  .title b{color:#fff;font-weight:600}
  .title-meta{color:#8a8a8a;font-size:11px;margin-left:auto;white-space:nowrap}
  .main{flex:1;display:flex;min-height:0}
  .activity{
    width:46px;flex:none;background:#333333;border-right:1px solid #252526;
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;
  }
  .act-btn{
    width:46px;height:44px;border:0;background:transparent;color:#858585;cursor:pointer;
    font-size:19px;display:grid;place-items:center;border-left:2px solid transparent;
  }
  .act-btn:hover{color:#d4d4d4}.act-btn.on{color:#fff;border-left-color:#007acc}
  .sidebar{
    width:262px;flex:none;background:var(--side);border-right:1px solid #1a1a1a;
    display:flex;flex-direction:column;min-height:0;
  }
  .side-head{
    height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;font-size:11px;letter-spacing:1px;color:#bbb;text-transform:uppercase;
  }
  .side-head span.actions{display:flex;gap:10px;letter-spacing:0;text-transform:none}
  .side-head button{background:none;border:0;color:#9a9a9a;cursor:pointer;font-size:13px;font-family:inherit}
  .side-head button:hover{color:#fff}
  .filter-box{padding:0 10px 9px;flex:none}
  .filter-box input{
    width:100%;height:28px;background:#3c3c3c;border:1px solid #3c3c3c;color:#ddd;
    padding:0 9px;font:12px/1 inherit;outline:none;border-radius:2px;
  }
  .filter-box input:focus{border-color:var(--accent)}
  .filter-box input::placeholder{color:#8c8c8c}
  .tree{flex:1;overflow:auto;padding-bottom:12px}
  .tree::-webkit-scrollbar,.editor::-webkit-scrollbar{width:11px;height:11px}
  .tree::-webkit-scrollbar-thumb,.editor::-webkit-scrollbar-thumb{background:#424242;border:3px solid transparent;background-clip:padding-box}
  .tree::-webkit-scrollbar-thumb:hover{background:#5a5a5a;background-clip:padding-box}
  .tree-root{font-size:11px;color:#ccc;padding:5px 12px;letter-spacing:.6px;font-weight:600}
  .node-row{
    display:flex;align-items:center;gap:6px;height:25px;padding:0 8px 0 12px;
    cursor:pointer;white-space:nowrap;font-size:12.5px;color:#c8c8c8;user-select:none;
  }
  .node-row:hover{background:var(--hover)}
  .node-row.active{background:var(--act);color:#fff}
  .node-row.hidden{display:none}
  .caret{width:11px;flex:none;color:#9a9a9a;font-size:10px;display:inline-block;text-align:center;transition:transform .12s}
  .caret.open{transform:rotate(90deg)}
  .caret.leaf{visibility:hidden}
  .folder-icon{color:#dcb67a;font-size:12px;flex:none}
  .ext{
    width:16px;height:16px;flex:none;border-radius:3px;display:grid;place-items:center;
    font-size:8px;font-weight:800;letter-spacing:-.3px;color:#1e1e1e;
  }
  .ext.js{background:#e8c34a}.ext.html{background:#e06c4a}.ext.css{background:#4a9fe0}
  .ext.json{background:#c9a94a}.ext.sh{background:#7ac07a}.ext.py{background:#6a9fd4}
  .ext.md{background:#8a9dc4}.ext.conf{background:#9a9a9a}.ext.txt{background:#9a9a9a}
  .fname{overflow:hidden;text-overflow:ellipsis}
  .children.collapsed{display:none}
  .editor-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .tabs{
    height:35px;flex:none;background:var(--side2);display:flex;overflow-x:auto;
    border-bottom:1px solid #252526;
  }
  .tabs::-webkit-scrollbar{height:0}
  .tab{
    display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;min-width:120px;max-width:230px;
    background:var(--tab);border-right:1px solid #252526;color:#969696;cursor:pointer;
    font-size:12px;white-space:nowrap;flex:none;
  }
  .tab:hover{color:#ccc}
  .tab.on{background:var(--tab-on);color:#fff;border-top:1px solid var(--accent);padding-top:0}
  .tab .fname{overflow:hidden;text-overflow:ellipsis}
  .tab .x{margin-left:auto;color:#8a8a8a;font-size:14px;line-height:1;padding:2px 3px;border-radius:3px}
  .tab .x:hover{background:#454545;color:#fff}
  .crumb{
    height:29px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;
    font-size:11.5px;color:#9a9a9a;background:var(--bg);user-select:none;
  }
  .crumb b{color:#c9c9c9;font-weight:500}
  .crumb .right{margin-left:auto;display:flex;gap:6px}
  .crumb button{
    background:#333;border:1px solid #454545;color:#bbb;border-radius:3px;
    padding:3px 9px;font:11px/1.4 inherit;cursor:pointer;
  }
  .crumb button:hover{background:#454545;color:#fff}
  .editor{
    flex:1;overflow:auto;background:var(--bg);padding:10px 0 40px;min-height:0;
  }
  code,.code{font-family:"Cascadia Code","JetBrains Mono",Consolas,"Microsoft YaHei",monospace;font-size:13px}
  .row{display:flex;min-height:20px;line-height:20px;white-space:pre}
  .row:hover{background:#252525}
  .lnum{
    width:62px;flex:none;text-align:right;padding-right:16px;color:#6e6e6e;
    user-select:none;border-right:1px solid #2b2b2b;margin-right:16px;font-size:12.5px;
  }
  .code{padding-right:30px;color:#d4d4d4;tab-size:2}
  .c-com{color:#6a9955}.c-str{color:#ce9178}.c-num{color:#b5cea8}
  .c-key{color:#569cd6}.c-ctrl{color:#c586c0}.c-fn{color:#dcdcaa}
  .c-type{color:#4ec9b0}.c-tag{color:#569cd6}.c-attr{color:#9cdcfe}
  .c-prop{color:#9cdcfe}.c-val{color:#ce9178}.c-punc{color:#d4d4d4}
  .c-head{color:#569cd6;font-weight:700}.c-link{color:#ce9178}
  .c-plain{color:#d4d4d4}
  .empty{
    flex:1;display:grid;place-items:center;color:#6a6a6a;font-size:13px;text-align:center;
  }
  .empty .big{font-size:40px;margin-bottom:14px;opacity:.5}
  .statusbar{
    height:24px;flex:none;background:var(--status);color:#fff;display:flex;align-items:center;
    gap:16px;padding:0 12px;font-size:11px;user-select:none;
  }
  .statusbar .sp{margin-left:auto;display:flex;gap:16px}
  #toast{
    position:fixed;bottom:40px;right:22px;background:#333;border:1px solid #555;
    color:#eee;padding:9px 15px;border-radius:4px;font-size:12px;opacity:0;
    transition:opacity .2s;pointer-events:none;box-shadow:0 8px 24px #0008;
  }
  #toast.show{opacity:1}
  @media(max-width:820px){.sidebar{width:200px}.activity{display:none}.title-meta{display:none}}
</style>
</head>
<body>

<div class="titlebar">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="title"><b>抽奖系统</b> — 源码浏览</div>
  <div class="title-meta" id="metaTop"></div>
</div>

<div class="main">
  <div class="activity">
    <button class="act-btn on" title="资源管理器">▤</button>
    <button class="act-btn" id="btnSearch" title="过滤文件">⌕</button>
    <button class="act-btn" id="btnCollapse" title="折叠全部">⊟</button>
  </div>

  <aside class="sidebar">
    <div class="side-head">
      <span>资源管理器</span>
      <span class="actions">
        <button id="btnExpand" title="展开全部">⊞</button>
        <button id="btnFold" title="折叠全部">⊖</button>
      </span>
    </div>
    <div class="filter-box"><input id="filter" placeholder="过滤文件… (Ctrl+P)" autocomplete="off"></div>
    <div class="tree"><div class="tree-root">LOTTERY / 源码</div><div id="treeBody"></div></div>
  </aside>

  <div class="editor-wrap">
    <div class="tabs" id="tabs"></div>
    <div class="crumb">
      <span id="crumb">lottery</span>
      <span class="right">
        <button id="btnCopy" title="复制当前文件源码">复制源码</button>
        <button id="btnDownload" title="下载当前文件">下载文件</button>
        <button id="btnWrap" title="切换自动换行">自动换行</button>
      </span>
    </div>
    <div class="editor" id="editor"><div class="empty"><div><div class="big">▤</div>从左侧选择一个文件查看源码</div></div></div>
  </div>
</div>

<div class="statusbar">
  <span id="stLeft">就绪</span>
  <span class="sp">
    <span id="stLines">0 行</span><span id="stSize">0 B</span>
    <span id="stLang">—</span><span>UTF-8</span><span>Ln 1, Col 1</span>
  </span>
</div>
<div id="toast"></div>

<script>
/* 源码数据由 build-codeview.js 注入 */
const FILES = __SOURCE_DATA__;
const PATHS = Object.keys(FILES).sort();

/* ---------------- 语法高亮 ---------------- */
const DEFS = {
  js: {
    re: /(<!--[\s\S]*?-->)|(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(0x[\da-fA-F]+|\d+(?:\.\d+)?(?:e[+-]?\d+)?)\b|\b(async|await|break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|of|return|static|super|switch|this|throw|try|typeof|var|void|while|with|yield|get|set)\b|\b(true|false|null|undefined|NaN|Infinity)\b|\b([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b/g,
    cls: ['c-com','c-com','c-str','c-num','c-key','c-num','c-fn','c-type']
  },
  json: {
    re: /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g,
    cls: function(m,i){ if(i===1) return m[2] ? 'c-attr' : 'c-str'; if(i===2) return 'c-punc'; if(i===3) return 'c-key'; return 'c-num'; }
  },
  html: {
    re: /(<!--[\s\S]*?-->)|(<!DOCTYPE[^>]*>)|(<\/?)([A-Za-z][\w-]*)|([\w-]+)(?=\s*=)|("[^"]*"|'[^']*')|(\/?>)/gi,
    cls: ['c-com','c-com','c-punc','c-tag','c-attr','c-str','c-punc']
  },
  css: {
    re: /(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|s|ms|deg|vh|vw|fr|ch)?\b)|([\w-]+)(?=\s*:)|(\.[\w-]+|#[\w-]+|::?[\w-]+|@[\w-]+)|([{}();:,])/g,
    cls: ['c-com','c-str','c-num','c-prop','c-type','c-punc']
  },
  md: {
    re: /^(#{1,6} .*)$|(```[\s\S]*?```|`[^`\n]*`)|(\*\*[^*\n]+\*\*|__[^_\n]+__)|(\[[^\]]*\]\([^)]*\))|^\s*(?:[-*+] |\d+\. |>)[\s\S]*?$|^\|.*$/gm,
    cls: ['c-head','c-str','c-key','c-link','c-attr','c-prop']
  },
  sh: {
    re: /(#[^\n]*)|("(?:\\.|[^"\\])*"|'[^']*'|\$\{[^}]*\})|\b(if|then|else|elif|fi|for|while|do|done|case|esac|function|return|local|export|sudo|echo|set|source|exit)\b|(\b\d+\b)|(\$\w+|\$\(|\bPORT\b|\bAPP_DIR\b)/g,
    cls: ['c-com','c-str','c-key','c-num','c-attr']
  },
  py: {
    re: /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(def|class|return|if|elif|else|for|while|in|import|from|as|with|try|except|finally|lambda|None|True|False|and|or|not|pass|break|continue|yield|global|raise|print)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\s*\()/g,
    cls: ['c-com','c-str','c-key','c-num','c-fn']
  },
  conf: {
    re: /(#[^\n]*)|(\[[\w-]+\])|([\w-]+)(?=\s*=)|(\b\d+\b)|("[^"]*")/g,
    cls: ['c-com','c-type','c-attr','c-num','c-str']
  },
  text: { re: null, cls: [] }
};

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function span(txt, cls){
  if(!txt) return '';
  const body = esc(txt).replace(/\n/g, '</span>\n<span class="'+cls+'">');
  return '<span class="'+cls+'">'+body+'</span>';
}
function highlight(raw, lang){
  const def = DEFS[lang] || DEFS.text;
  if(!def.re) return esc(raw);
  const re = new RegExp(def.re.source, def.re.flags);
  let out='', last=0, m;
  while((m = re.exec(raw)) !== null){
    if(m[0] === ''){ re.lastIndex++; continue; }
    out += esc(raw.slice(last, m.index));
    let tok = '';
    for(let i=1;i<m.length;i++){
      if(m[i] === undefined || m[i] === '') continue;
      const c = typeof def.cls === 'function' ? def.cls(m,i) : def.cls[i-1] || 'c-plain';
      tok += span(m[i], c);
    }
    out += tok || span(m[0],'c-plain');
    last = re.lastIndex;
  }
  out += esc(raw.slice(last));
  return out;
}
function renderCode(raw, lang){
  const lines = highlight(raw, lang).split('\n');
  return lines.map((l,i)=>'<div class="row"><span class="lnum">'+(i+1)+'</span><span class="code">'+(l || ' ')+'</span></div>').join('');
}

/* ---------------- 文件树 ---------------- */
function buildTree(){
  const root = {dirs:{},files:[]};
  PATHS.forEach(p=>{
    const parts = p.split('/');
    let cur = root;
    for(let i=0;i<parts.length-1;i++){
      const d = parts[i];
      if(!cur.dirs[d]) cur.dirs[d] = {dirs:{},files:[],path:parts.slice(0,i+1).join('/')};
      cur = cur.dirs[d];
    }
    cur.files.push(p);
  });
  return root;
}
const EXT = {js:'js',html:'html',css:'css',json:'json',sh:'sh',py:'py',md:'md',service:'conf'};
function badge(p){
  const e = p.split('.').pop().toLowerCase();
  const k = EXT[e] || (p.indexOf('.')<0 ? 'conf' : 'txt');
  const label = (e==='service'?'svc':e).slice(0,4).toUpperCase();
  return '<span class="ext '+k+'">'+esc(label)+'</span>';
}
function nodeDir(name, node, depth){
  const dirs = Object.keys(node.dirs).sort();
  const kids = dirs.map(d=>nodeDir(d,node.dirs[d],depth+1))
    .concat(node.files.map(f=>nodeFile(f,depth+1))).join('');
  return '<div class="dir-node" data-path="'+esc(node.path||name)+'">'
    + '<div class="node-row" style="padding-left:'+(12+depth*14)+'px" data-dir="1">'
    + '<span class="caret open">▶</span><span class="folder-icon">▣</span><span class="fname">'+esc(name)+'</span></div>'
    + '<div class="children">'+kids+'</div></div>';
}
function nodeFile(p, depth){
  const name = p.split('/').pop();
  return '<div class="file-node" data-path="'+esc(p)+'"><div class="node-row" style="padding-left:'+(12+depth*14)+'px" data-file="'+esc(p)+'">'
    + '<span class="caret leaf">▶</span>'+badge(p)+'<span class="fname">'+esc(name)+'</span></div></div>';
}
const treeBody = document.getElementById('treeBody');
const ROOT = buildTree();
treeBody.innerHTML = Object.keys(ROOT.dirs).sort().map(d=>nodeDir(d,ROOT.dirs[d],0)).join('')
  + ROOT.files.map(f=>nodeFile(f,0)).join('');

/* ---------------- 交互 ---------------- */
let current = null;
const tabs = new Map();
const $ = id => document.getElementById(id);
const editor = $('editor');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1600);
}
function renderTabs(){
  $('tabs').innerHTML = [...tabs.keys()].map(p=>{
    const on = p===current ? ' on' : '';
    return '<div class="tab'+on+'" data-tab="'+esc(p)+'">'+badge(p)+'<span class="fname">'+esc(p.split('/').pop())+'</span><span class="x" data-close="'+esc(p)+'">×</span></div>';
  }).join('');
}
function openFile(p){
  if(!FILES[p]) return;
  current = p; tabs.set(p, true);
  const f = FILES[p];
  editor.innerHTML = renderCode(f.content, f.lang);
  editor.scrollTop = 0;
  $('crumb').innerHTML = 'lottery / ' + p.split('/').map((s,i,a)=> i===a.length-1 ? '<b>'+esc(s)+'</b>' : esc(s)).join(' / ');
  $('stLeft').textContent = p;
  $('stLines').textContent = f.lines + ' 行';
  $('stSize').textContent = f.size < 1024 ? f.size + ' B' : (f.size/1024).toFixed(1) + ' KB';
  $('stLang').textContent = f.lang.toUpperCase();
  document.querySelectorAll('.node-row[data-file]').forEach(n=>n.classList.toggle('active', n.dataset.file===p));
  renderTabs();
}
function closeTab(p){
  tabs.delete(p);
  if(current===p){ current = [...tabs.keys()].pop() || null;
    if(current) openFile(current);
    else { editor.innerHTML = '<div class="empty"><div><div class="big">▤</div>从左侧选择一个文件查看源码</div></div>'; $('crumb').textContent='lottery'; $('stLeft').textContent='就绪'; renderTabs(); }
  } else renderTabs();
}

treeBody.addEventListener('click', e=>{
  const row = e.target.closest('.node-row'); if(!row) return;
  if(row.dataset.file){ openFile(row.dataset.file); return; }
  const wrap = row.parentElement;
  const ch = wrap.querySelector(':scope > .children');
  const car = row.querySelector('.caret');
  if(ch){ ch.classList.toggle('collapsed'); car.classList.toggle('open'); }
});
$('tabs').addEventListener('click', e=>{
  const x = e.target.closest('[data-close]');
  if(x){ e.stopPropagation(); closeTab(x.dataset.close); return; }
  const t = e.target.closest('[data-tab]'); if(t) openFile(t.dataset.tab);
});
$('filter').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.file-node').forEach(n=>n.classList.toggle('hidden', !!q && !n.dataset.path.toLowerCase().includes(q)));
  document.querySelectorAll('.dir-node').forEach(n=>{
    const vis = [...n.querySelectorAll('.file-node')].some(f=>!f.classList.contains('hidden'));
    n.classList.toggle('hidden', !!q && !vis);
    if(q && vis) n.querySelectorAll(':scope > .children').forEach(c=>c.classList.remove('collapsed'));
  });
  document.querySelectorAll('.tree-root').forEach(n=>n.classList.toggle('hidden',!!q));
});
$('filter').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const first = [...document.querySelectorAll('.file-node:not(.hidden)')][0];
    if(first) openFile(first.dataset.path);
    e.target.blur();
  }
  if(e.key==='Escape'){ e.target.value=''; e.target.dispatchEvent(new Event('input')); }
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='p'){ e.preventDefault(); $('filter').focus(); $('filter').select(); }
});
$('btnExpand').addEventListener('click', ()=>document.querySelectorAll('.children').forEach(c=>{c.classList.remove('collapsed'); c.parentElement.querySelector(':scope > .node-row .caret').classList.add('open')}));
$('btnFold').addEventListener('click', ()=>document.querySelectorAll('.dir-node > .children').forEach(c=>{c.classList.add('collapsed'); c.parentElement.querySelector(':scope > .node-row .caret').classList.remove('open')}));
$('btnCollapse').addEventListener('click', ()=>$('btnFold').click());
$('btnSearch').addEventListener('click', ()=>$('filter').focus());
$('btnCopy').addEventListener('click', async ()=>{
  if(!current) return toast('请先打开一个文件');
  try{ await navigator.clipboard.writeText(FILES[current].content); toast('已复制 '+current); }
  catch(_){ const ta=document.createElement('textarea'); ta.value=FILES[current].content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制 '+current); }
});
$('btnDownload').addEventListener('click', ()=>{
  if(!current) return toast('请先打开一个文件');
  const blob = new Blob([FILES[current].content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = current.split('/').pop(); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('已下载 '+current.split('/').pop());
});
let wrap = false;
$('btnWrap').addEventListener('click', ()=>{
  wrap = !wrap;
  document.querySelectorAll('.row').forEach(r=>{ r.style.whiteSpace = wrap ? 'pre-wrap' : 'pre'; r.style.wordBreak = wrap ? 'break-all' : 'normal'; });
  $('btnWrap').style.background = wrap ? '#555' : '#333';
  toast(wrap ? '自动换行：开' : '自动换行：关');
});

let totalLines=0, totalBytes=0;
PATHS.forEach(p=>{ totalLines+=FILES[p].lines; totalBytes+=FILES[p].size; });
$('metaTop').textContent = PATHS.length + ' 个文件 · ' + totalLines + ' 行 · ' + (totalBytes/1024).toFixed(1) + ' KB · 离线内嵌';
openFile(PATHS.indexOf('server/index.js')>=0 ? 'server/index.js' : PATHS[0]);
</script>
</body>
</html>
